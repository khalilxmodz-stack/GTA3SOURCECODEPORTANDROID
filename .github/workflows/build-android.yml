name: Build GTA3 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/launcher/**'
      - 'src/**'
      - 'vendor/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-android.yml'
  workflow_run:
    workflows: ["Unzip"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: gta3-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # When triggered after Unzip, build only if Unzip succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships an Android SDK ($ANDROID_HOME), so we use it
      # directly instead of android-actions/setup-android (which hung on
      # "sdkmanager --licenses").
      - name: Install Android SDK packages, NDK and CMake
        shell: bash
        run: |
          set -ex
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          "$SDKM" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # librw is a git submodule that is NOT included when the project is
      # uploaded as a zip, so fetch it here if it is missing.
      - name: Fetch librw if missing
        shell: bash
        run: |
          set -ex
          if [ ! -f vendor/librw/CMakeLists.txt ]; then
            rm -rf vendor/librw
            git clone --depth 1 --branch android-sdl2-fixes \
              https://github.com/codepdbh/librw-re3-android.git vendor/librw \
              || git clone --depth 1 \
              https://github.com/codepdbh/librw-re3-android.git vendor/librw
          fi

      - name: Check required source and vendor files
        shell: bash
        run: |
          set -eux
          test -f android/launcher/gradlew
          test -f android/launcher/app/CMakeLists.txt
          test -f vendor/librw/CMakeLists.txt
          test -d vendor/sdl2
          test -d vendor/openal-soft
          test -d vendor/mpg123
          test -f vendor/sdl2/libs/Android/arm64-v8a/libSDL2.so
          test -f vendor/sdl2/libs/Android/armeabi-v7a/libSDL2.so

      - name: Build both Android variants
        working-directory: android/launcher
        shell: bash
        run: |
          chmod +x ./gradlew
          # Full output goes to a file (it is huge); only the errors are printed.
          if ./gradlew --no-daemon --stacktrace --console=plain \
               assembleStandardDebug assembleFwrDebug > "$GITHUB_WORKSPACE/build.log" 2>&1; then
            echo "BUILD OK"
          else
            echo "================ BUILD FAILED: first errors ================"
            grep -n -m 40 -E "error:|error TS|FAILED|What went wrong|Execution failed|CMake Error|undefined reference|fatal error|ld: error" "$GITHUB_WORKSPACE/build.log" || true
            echo "================ last 60 lines ================"
            tail -n 60 "$GITHUB_WORKSPACE/build.log"
            exit 1
          fi

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: List generated APK files
        if: always()
        run: |
          find android/launcher/app/build/outputs/apk -type f -name '*.apk' -print || true

      - name: Upload standard APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA3-Android-standard-APK
          path: android/launcher/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload FWR APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA3-Android-FWR-APK
          path: android/launcher/app/build/outputs/apk/fwr/debug/*.apk
          if-no-files-found: error
          retention-days: 14
